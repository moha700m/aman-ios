name: Aman
options:
  bundleIdPrefix: com.moha700m
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Aman:
    type: application
    platform: iOS
    sources: [Aman]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.aman
        PRODUCT_NAME: Aman
        INFOPLIST_FILE: Aman/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
  AmanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AmanTests]
    dependencies:
      - target: Aman
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.aman.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  Aman:
    build:
      targets:
        Aman: all
        AmanTests: [test]
    test:
      targets: [AmanTests]
